<script>

/* =====================================================
   NAME SYSTEM
===================================================== */

const nameInput =
    document.getElementById("nameInput");

const senderName =
    document.getElementById("senderName");

const senderMessage =
    document.getElementById("senderMessage");

const shareButton =
    document.getElementById("shareButton");


/* =====================================================
   SHOW SENDER MESSAGE
===================================================== */

function showSenderName(name){

    name =
        name
        .trim()
        .replace(/\s+/g," ")
        .substring(0,40);


    if(name){

        senderName.textContent =
            name;

        senderMessage.textContent =
            " की तरफ से आपके परिवार को नवरात्रि की हार्दिक शुभकामनाएं! 🙏";

    }
    else{

        senderName.textContent =
            "";

        senderMessage.textContent =
            "";

    }

}


/* =====================================================
   READ NAME FROM SHARED URL
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const sharedName =
    urlParams.get("name");


/* =====================================================
   IF SHARED LINK CONTAINS NAME
===================================================== */

if(sharedName){

    const cleanName =
        sharedName
        .trim()
        .replace(/\s+/g," ")
        .substring(0,40);


    if(cleanName){

        /*
           नाम greeting में दिखेगा।
           Input खाली रहेगा ताकि नया व्यक्ति
           अपना नाम लिख सके।
        */

        nameInput.value = "";

        showSenderName(
            cleanName
        );

    }

}


/* =====================================================
   USER TYPES NEW NAME
===================================================== */

nameInput.addEventListener(
    "input",
    function(){

        const name =
            nameInput.value;

        /*
           सिर्फ preview बदलेगा।
        */

        if(name.trim()){

            showSenderName(name);

        }
        else{

            /*
               अगर नाम हटाया गया,
               तो shared sender वापस दिखेगा।
            */

            if(sharedName){

                showSenderName(
                    sharedName
                );

            }
            else{

                showSenderName("");

            }

        }

    }
);


/* =====================================================
   FIREWORK CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "fireworks"
    );

const ctx =
    canvas.getContext("2d");


let W = 0;

let H = 0;

let rockets = [];

let particles = [];


/* =====================================================
   RESIZE
===================================================== */

function resizeCanvas(){

    const rect =
        canvas.parentElement
        .getBoundingClientRect();


    W =
        rect.width;

    H =
        rect.height;


    canvas.width =
        Math.floor(
            W * devicePixelRatio
        );

    canvas.height =
        Math.floor(
            H * devicePixelRatio
        );


    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";


    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =====================================================
   CREATE FIREWORK ROCKET
===================================================== */

function createRocket(){

    const x =
        30 +
        Math.random() *
        Math.max(
            10,
            W - 60
        );


    const targetY =
        30 +
        Math.random() *
        Math.min(
            H * .50,
            230
        );


    rockets.push({

        x:x,

        y:H + 5,

        targetY:targetY,

        speed:
        3 +
        Math.random()*2

    });

}


/* =====================================================
   EXPLOSION
===================================================== */

function explode(x,y){

    const count =
        18 +
        Math.floor(
            Math.random()*14
        );


    const power =
        1.2 +
        Math.random()*1.3;


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle =
            Math.PI * 2 * i / count;


        particles.push({

            x:x,

            y:y,

            vx:
            Math.cos(angle) *
            power,

            vy:
            Math.sin(angle) *
            power,

            life:
            35 +
            Math.random()*25,

            maxLife:60,

            size:
            1.2 +
            Math.random()*1.8,

            gravity:
            .025 +
            Math.random()*.02

        });

    }

}


/* =====================================================
   UPDATE FIREWORKS
===================================================== */

function updateFireworks(){

    for(
        let i=rockets.length-1;
        i>=0;
        i--
    ){

        const rocket =
            rockets[i];


        rocket.y -=
            rocket.speed;


        if(
            rocket.y <=
            rocket.targetY
        ){

            explode(
                rocket.x,
                rocket.y
            );


            rockets.splice(
                i,
                1
            );

        }

    }


    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vy += p.gravity;

        p.vx *= .985;

        p.life--;


        if(p.life <= 0){

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   DRAW FIREWORKS
===================================================== */

function drawFireworks(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    rockets.forEach(
        function(rocket){

            ctx.beginPath();

            ctx.arc(
                rocket.x,
                rocket.y,
                2,
                0,
                Math.PI*2
            );


            ctx.fillStyle =
                "rgba(255,220,90,.85)";


            ctx.shadowBlur =
                7;


            ctx.shadowColor =
                "#ffd54a";


            ctx.fill();

        }
    );


    particles.forEach(
        function(p){

            const alpha =
                Math.max(
                    0,
                    p.life /
                    p.maxLife
                );


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI*2
            );


            ctx.fillStyle =
                "rgba(255,210,70," +
                alpha +
                ")";


            ctx.shadowBlur =
                7;


            ctx.shadowColor =
                "#ff9800";


            ctx.fill();

        }
    );


    ctx.shadowBlur =
        0;

}


/* =====================================================
   FIREWORK ANIMATION
===================================================== */

function fireworkAnimation(){

    updateFireworks();

    drawFireworks();

    requestAnimationFrame(
        fireworkAnimation
    );

}


fireworkAnimation();


/* =====================================================
   FIREWORK TIMING
===================================================== */

function launchFirework(){

    createRocket();


    setTimeout(
        launchFirework,

        1700 +
        Math.random()*2200
    );

}


setTimeout(
    launchFirework,
    1200
);


/* =====================================================
   AUDIO
===================================================== */

let audioContext =
    null;

let audioStarted =
    false;

let soundTimer =
    null;


/* =====================================================
   SETUP AUDIO
===================================================== */

function setupAudio(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext){

            return false;

        }


        audioContext =
            new AudioContext();

    }


    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }


    return true;

}


/* =====================================================
   CREATE NOISE
===================================================== */

function createNoise(duration){

    const length =
        Math.floor(
            audioContext.sampleRate *
            duration
        );


    const buffer =
        audioContext.createBuffer(
            1,
            length,
            audioContext.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for(
        let i=0;
        i<length;
        i++
    ){

        data[i] =
            Math.random()*2-1;

    }


    return buffer;

}


/* =====================================================
   SOFT CRACKER
===================================================== */

function softCracker(){

    if(!audioContext)
        return;


    const now =
        audioContext.currentTime;


    const source =
        audioContext.createBufferSource();


    source.buffer =
        createNoise(.10);


    const filter =
        audioContext.createBiquadFilter();


    filter.type =
        "highpass";


    filter.frequency.value =
        1000;


    const gain =
        audioContext.createGain();


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .09,
        now+.005
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.10
    );


    source
    .connect(filter)
    .connect(gain)
    .connect(
        audioContext.destination
    );


    source.start(now);

    source.stop(
        now+.11
    );

}


/* =====================================================
   SOFT BOOM
===================================================== */

function softBoom(){

    if(!audioContext)
        return;


    const now =
        audioContext.currentTime;


    const source =
        audioContext.createBufferSource();


    source.buffer =
        createNoise(.22);


    const filter =
        audioContext.createBiquadFilter();


    filter.type =
        "lowpass";


    filter.frequency.value =
        1700;


    const gain =
        audioContext.createGain();


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .13,
        now+.008
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.22
    );


    source
    .connect(filter)
    .connect(gain)
    .connect(
        audioContext.destination
    );


    source.start(now);

    source.stop(
        now+.23
    );

}


/* =====================================================
   DEVOTIONAL TUNE
===================================================== */

function devotionalMelody(){

    if(!audioContext)
        return;


    const now =
        audioContext.currentTime;


    const notes = [

        261.63,
        293.66,
        329.63,
        392.00,
        329.63,
        293.66,

        261.63,
        329.63,
        392.00,
        523.25,

        392.00,
        329.63,
        293.66,
        261.63

    ];


    notes.forEach(
        function(freq,index){

            const start =
                now +
                index*.40;


            const oscillator =
                audioContext
                .createOscillator();


            const gain =
                audioContext
                .createGain();


            const filter =
                audioContext
                .createBiquadFilter();


            oscillator.type =
                "sine";


            oscillator.frequency.setValueAtTime(
                freq,
                start
            );


            filter.type =
                "lowpass";


            filter.frequency.value =
                1600;


            gain.gain.setValueAtTime(
                .0001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                .05,
                start+.04
            );


            gain.gain.exponentialRampToValueAtTime(
                .0001,
                start+.36
            );


            oscillator
            .connect(filter)
            .connect(gain)
            .connect(
                audioContext.destination
            );


            oscillator.start(start);

            oscillator.stop(
                start+.38
            );

        }
    );

}


/* =====================================================
   DEVOTIONAL BACKGROUND TONE
===================================================== */

function devotionalDrone(){

    if(!audioContext)
        return;


    const now =
        audioContext.currentTime;


    const oscillator =
        audioContext
        .createOscillator();


    const gain =
        audioContext
        .createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.value =
        130.81;


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.linearRampToValueAtTime(
        .012,
        now+1
    );


    gain.gain.linearRampToValueAtTime(
        .0001,
        now+4
    );


    oscillator
    .connect(gain)
    .connect(
        audioContext.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now+4
    );

}


/* =====================================================
   RANDOM SOUND
===================================================== */

function randomSound(){

    if(!audioStarted)
        return;


    const type =
        Math.floor(
            Math.random()*5
        );


    if(type === 0){

        softCracker();

    }

    else if(type === 1){

        softBoom();

    }

    else if(type === 2){

        softCracker();

        setTimeout(
            softCracker,
            220
        );

    }

    else{

        devotionalDrone();

    }


    soundTimer =
        setTimeout(
            randomSound,

            3000 +
            Math.random()*3000
        );

}


/* =====================================================
   START AUDIO
===================================================== */

function startAudio(){

    if(!setupAudio())
        return;


    if(audioStarted)
        return;


    audioStarted =
        true;


    devotionalMelody();


    setTimeout(
        function(){

            softCracker();

        },
        1800
    );


    soundTimer =
        setTimeout(
            randomSound,
            5000
        );

}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    function(){

        try{

            startAudio();

        }
        catch(error){

            console.log(error);

        }

    }
);


/* =====================================================
   MOBILE AUDIO
===================================================== */

document.addEventListener(
    "click",
    function(){

        startAudio();

    },
    {
        passive:true
    }
);


document.addEventListener(
    "touchstart",
    function(){

        startAudio();

    },
    {
        passive:true
    }
);


/* =====================================================
   WHATSAPP SHARE
===================================================== */

shareButton.addEventListener(
    "click",
    async function(){

        const name =
            nameInput.value
            .trim()
            .replace(/\s+/g," ")
            .substring(0,40);


        if(!name){

            nameInput.focus();

            alert(
                "पहले अपना नाम लिखें"
            );

            return;

        }


        startAudio();


        /* =============================================
           CURRENT URL
        ============================================= */

        const shareUrl =
            new URL(
                window.location.href
            );


        /*
           पुराने parameters हटाएं
        */

        shareUrl.search = "";


        /*
           इस बार जिसने नाम लिखा है
           उसका नाम URL में जाएगा
        */

        shareUrl.searchParams.set(
            "name",
            name
        );


        const finalUrl =
            shareUrl.toString();


        /* =============================================
           WHATSAPP MESSAGE
        ============================================= */

        const whatsappMessage =

            "🌺 " +
            name +
            " की तरफ से आपको और आपके परिवार को " +
            "नवरात्रि की हार्दिक शुभकामनाएं! 🙏🌺\n\n" +

            "🪔 जय माता दी ❤️\n\n" +

            finalUrl;


        /* =============================================
           MOBILE SHARE
        ============================================= */

        if(
            navigator.share &&
            /Android|iPhone|iPad|iPod/i.test(
                navigator.userAgent
            )
        ){

            try{

                await navigator.share({

                    title:
                    "नवरात्रि की हार्दिक शुभकामनाएं",

                    text:
                    "🌺 " +
                    name +
                    " की तरफ से आपको और आपके परिवार को " +
                    "नवरात्रि की हार्दिक शुभकामनाएं! 🙏",

                    url:
                    finalUrl

                });

                return;

            }
            catch(error){

                if(
                    error &&
                    error.name ===
                    "AbortError"
                ){

                    return;

                }

            }

        }


        /* =============================================
           WHATSAPP FALLBACK
        ============================================= */

        const whatsappUrl =
            "https://wa.me/?text=" +
            encodeURIComponent(
                whatsappMessage
            );


        window.location.href =
            whatsappUrl;

    }
);

</script>
